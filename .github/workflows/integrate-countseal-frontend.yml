name: Integrate CountSeal frontend source
on:
  push:
    branches:
      - integration/countseal-frontend
    paths:
      - .integration/countseal-frontend.tar.xz
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/countseal-frontend
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply frontend files and refresh lockfile
        run: |
          tar -xJf .integration/countseal-frontend.tar.xz -C .
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          rm -rf .integration
          rm .github/workflows/integrate-countseal-frontend.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate CountSeal procurement workspace frontend"
          git push origin HEAD:integration/countseal-frontend
